# Hard Problems Assistants
sane-assistant-engineering: { model: "openai/gpt-6-astra", variant: low }
sane-assistant-product: { model: "openai/gpt-6-astra", variant: low }

# Wide Coverage Assistants
sane-assistant-design: { model: "openai/gpt-5.6-sol", variant: medium }
sane-assistant-research: { model: "openai/gpt-5.6-sol", variant: medium }
sane-assistant-coordination: { model: "openai/gpt-5.6-sol", variant: medium }

# Wide Coverage - Low Verbosity Assistants (They create more compact prompts for other agents)
sane-assistant-planning: { model: "openai/gpt-5.6-sol", variant: low }

# Wide Coverage Workers
sane-worker-reviewer: { model: "openai/gpt-5.6-terra", variant: medium }
sane-worker-researcher: { model: "openai/gpt-5.6-terra", variant: medium }
sane-worker-scout: { model: "openai/gpt-5.6-terra", variant: medium }
sane-worker-grounder: { model: "openai/gpt-5.6-terra", variant: medium }

# Deep Focus Workers
# sane-worker-implementer: { model: "openai/gpt-6-astra", variant: low }
sane-worker-implementer: { model: "openai/gpt-5.6-terra", variant: high }
sane-worker-fixer: { model: "openai/gpt-6-astra", variant: low }
