# Hard Problems Assistants
sane/assistant/design: { model: "openai/gpt-6-astra", variant: low }
sane/assistant/engineering: { model: "openai/gpt-6-astra", variant: low }

# Wide Coverage - Low Verbosity Assistants (They create more compact prompts for other agents)
sane/assistant/planning: { model: "openai/gpt-6-sol", variant: low }

# Wide Coverage Assistants
sane/assistant/research: { model: "openai/gpt-6-sol", variant: medium }
sane/assistant/execution: { model: "openai/gpt-6-sol", variant: medium }

# Wide Coverage Workers
sane/worker/reviewer: { model: "openai/gpt-6-sol", variant: low }
sane/worker/scout: { model: "openai/gpt-6-sol", variant: low }
sane/worker/grounder: { model: "openai/gpt-6-sol", variant: low }

# Deep Focus Workers
# sane-worker-implementer: { model: "openai/gpt-6-astra", variant: low }
sane/worker/researcher: { model: "openai/gpt-6-sol", variant: medium }
sane/worker/implementer: { model: "openai/gpt-6-sol", variant: medium }
sane/worker/fixer: { model: "openai/gpt-6-sol", variant: medium }
